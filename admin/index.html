<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#151515">
  <title>成绩管理 · DRAGONDANCE</title>
  <link rel="stylesheet" href="/admin/styles.css">
  <script type="module" src="/admin/admin.mjs"></script>
</head>
<body>
  <header class="page-header"><a href="/" class="brand">DRAGONDANCE <span>成绩管理</span></a><a href="/" class="back-link">返回游戏 ↗</a></header>
  <main>
    <section id="loginPanel" class="login-panel">
      <p class="eyebrow">ADMIN ACCESS</p><h1>登录后台</h1><p class="muted">管理在线排行榜的玩家成绩。</p>
      <form id="loginForm">
        <label for="adminPassword">管理密码</label><input id="adminPassword" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        <button id="loginButton" class="primary" type="submit">登录</button>
      </form>
      <p id="loginFeedback" class="feedback" role="status">正在检查登录状态…</p>
    </section>
    <section id="managerPanel" hidden>
      <div class="page-title"><div><p class="eyebrow">LEADERBOARD ADMIN</p><h1>玩家成绩</h1></div><div class="actions"><button id="reloadButton" type="button">刷新</button><button id="logoutButton" type="button">退出登录</button></div></div>
      <div class="stat-grid"><div><span>有效成绩</span><strong id="activeCount">0</strong></div><div><span>独立玩家</span><strong id="playerCount">0</strong></div><div><span>回收站</span><strong id="deletedCount">0</strong></div></div>
      <div class="toolbar"><div class="tabs" aria-label="成绩筛选"><button id="activeTab" type="button" aria-pressed="true">有效成绩</button><button id="deletedTab" type="button" aria-pressed="false">回收站</button></div><label class="search-label" for="searchInput">搜索<input id="searchInput" type="search" placeholder="昵称、玩家编号或成绩编号" autocomplete="off"></label></div>
      <p id="managerFeedback" class="feedback" role="status">正在读取成绩…</p>
      <div class="table-wrap"><table><thead><tr><th scope="col">车手 / 玩家编号</th><th scope="col">距路障</th><th scope="col">起步反应</th><th scope="col">冲线时间</th><th scope="col">综合得分</th><th scope="col">提交时间</th><th scope="col">操作</th></tr></thead><tbody id="scoreRows"></tbody></table><p id="noResults" class="empty" hidden>没有符合条件的成绩。</p></div>
      <div class="pagination"><span id="pageInfo"></span><div class="actions"><button id="previousPage" type="button">上一页</button><button id="nextPage" type="button">下一页</button></div></div>
      <details class="audit"><summary>最近操作记录</summary><ol id="auditRows"></ol></details>
    </section>
  </main>
  <dialog id="editDialog" aria-labelledby="editTitle">
    <form id="editForm"><div class="dialog-heading"><h2 id="editTitle">修改成绩</h2><button id="closeEdit" type="button" aria-label="关闭修改">×</button></div><p class="muted" id="editIdentity"></p>
      <label for="editName">车手昵称</label><input id="editName" type="text" maxlength="40" required>
      <div class="field-grid"><div><label for="editDistance">距路障（米）</label><input id="editDistance" type="number" min="0" max="250" step="0.01" required></div><div><label for="editReaction">起步反应（毫秒）</label><input id="editReaction" type="number" min="0" max="10000" step="1" required></div><div><label for="editFinish">冲线时间（秒）</label><input id="editFinish" type="number" min="18" max="610" step="0.001" required></div><div><label for="editTotal">停车用时（秒）</label><input id="editTotal" type="number" min="18" max="610" step="0.001" required></div></div>
      <p class="calculated">综合得分 <strong id="editScore">—</strong><span>按成绩自动计算</span></p><p class="feedback" id="editFeedback" role="status"></p>
      <div class="dialog-actions"><button type="button" id="cancelEdit">取消</button><button type="submit" id="saveEdit" class="primary">保存修改</button></div>
    </form>
  </dialog>
  <dialog id="deleteDialog" aria-labelledby="deleteTitle"><form id="deleteForm"><h2 id="deleteTitle">将成绩移入回收站？</h2><p id="deleteIdentity"></p><p class="muted">这局成绩会从公开排行榜移除，可以在回收站恢复。其他回合继续参与排名。</p><p id="deleteFeedback" class="feedback" role="status"></p><div class="dialog-actions"><button id="cancelDelete" type="button">取消</button><button id="confirmDelete" class="danger" type="submit">移入回收站</button></div></form></dialog>
</body>
</html>
